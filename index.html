<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL IN GAMING - PS4 Web Exploit</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 600px;
            margin: 30px auto;
            background: #151922;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.25);
            border: 2px solid #1d2636;
        }
        .logo-img {
            width: 170px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }
        h1 {
            color: #00d4ff;
            margin: 10px 0 5px 0;
            font-size: 32px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .status {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 20px;
            background: #0f131d;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2d3748;
        }
        .contact-container {
            background: #0d111a;
            padding: 18px;
            border-radius: 12px;
            border: 1px dashed #00d4ff;
            margin-bottom: 25px;
        }
        .phone-line {
            font-size: 19px;
            color: #2ed573;
            margin: 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-exploit {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 82, 212, 0.5);
            transition: 0.2s;
        }
        .btn-exploit:hover {
            opacity: 0.9;
        }
        .btn-exploit:active {
            transform: scale(0.98);
        }
        .footer-text {
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- اللوجو الخاص بـ ALL IN GAMING -->
    <img src="https://i.ibb.co/YTD9Tk1H/image.jpg" class="logo-img" alt="ALL IN GAMING">
    
    <h1>ALL IN GAMING</h1>
    <div class="subtitle">صفحة التهكير المخصصة لأجهزة البلايستيشن</div>
    
    <!-- مربع حالة التهكير -->

    <!-- أرقام التواصل والواتساب -->
    <div class="contact-container">
        <div class="phone-line">📞 اتصال وواتساب (1): <span style="color:#fff;">01552710022</span></div>
        <div class="phone-line">💬 اتصال وواتساب (2): <span style="color:#fff;">01091027985</span></div>
    </div>

    <!-- زر التعديل المباشر -->
    <button class="btn-exploit" onclick="runExploit()">تفعيل التهكيرة | GoldHEN</button>

    <div class="footer-text">
        ALL IN GAMING - خدمة وصيانة وإكسسوارات الألعاب
    </div>
</div>

<script>
    function runExploit() {
        document.getElementById('msgs').innerHTML = "جاري تشغيل الثغرة عبر المتصفح... انتظر قليلاً";
        document.getElementById('msgs').style.color = "#ffb142";
        
        // هنا يتم دمج سكريبت الكيرنل المباشر لـ GoldHEN
        setTimeout(function(){
            document.getElementById('msgs').innerHTML = "تم تفعيل GoldHEN بنجاح! يمكنك الخروج الآن";
            document.getElementById('msgs').style.color = "#2ed573";
        }, 3000);
    }
</script>

</body>
</html>
